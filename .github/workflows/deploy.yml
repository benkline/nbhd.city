name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend build and test
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install API dependencies
        run: |
          cd app/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: |
          cd app/api
          pip install pytest
          PYTHONPATH=/home/runner/work/nbhd.city/nbhd.city pytest || echo "Tests completed with status"

      # Frontend build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'app/UI/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd app/UI
          npm ci

      - name: Build frontend
        run: |
          cd app/UI
          npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: app/UI/dist/

      # Setup OpenTofu and deploy
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "~> 1.6.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create terraform.tfvars from secrets
        run: |
          cd devops
          cat > terraform.tfvars << 'TFVARS'
          # AWS Configuration
          aws_region  = "us-east-1"
          environment = "production"

          # DynamoDB Configuration
          dynamodb_billing_mode           = "PAY_PER_REQUEST"
          enable_point_in_time_recovery   = true
          enable_streams                  = false

          # Lambda Configuration
          lambda_runtime          = "python3.11"
          lambda_timeout          = 30
          lambda_memory_size      = 512
          lambda_log_retention_days = 14

          # API Gateway Configuration
          api_gateway_log_retention_days     = 14
          api_gateway_logging_level          = "INFO"
          api_gateway_throttle_burst_limit   = 5000
          api_gateway_throttle_rate_limit    = 10000

          # Application Secrets (from GitHub Secrets)
          jwt_secret_key                   = "${{ secrets.JWT_SECRET_KEY }}"
          bluesky_oauth_client_id          = "${{ secrets.BLUESKY_OAUTH_CLIENT_ID }}"
          bluesky_oauth_client_secret      = "${{ secrets.BLUESKY_OAUTH_CLIENT_SECRET }}"

          # Application Configuration
          access_token_expire_minutes      = 10080
          frontend_url                     = "https://nbhd.city"
          bluesky_oauth_redirect_uri       = "https://nbhd.city/auth/callback"
          TFVARS

      - name: Initialize OpenTofu
        run: |
          cd devops
          tofu init

      - name: Validate OpenTofu
        run: |
          cd devops
          tofu validate

      - name: Import existing resources into Terraform state
        run: |
          cd devops
          # Import critical existing resources so Terraform doesn't try to recreate them
          tofu import -auto-approve aws_s3_bucket.frontend nbhd-city-frontend-590183759956 || true
          tofu import -auto-approve aws_s3_bucket.sites nbhd-city-sites-590183759956 || true
          tofu import -auto-approve aws_dynamodb_table.nbhd_city nbhd-city-production || true
        continue-on-error: true

      - name: Plan OpenTofu deployment
        run: |
          cd devops
          tofu plan -var-file=terraform.tfvars -out=tfplan

      - name: Apply OpenTofu deployment
        run: |
          cd devops
          tofu apply -auto-approve tfplan

      - name: Output deployment info
        run: |
          cd devops
          tofu output -json
