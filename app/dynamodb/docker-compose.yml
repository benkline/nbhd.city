version: '3.8'

services:
  # DynamoDB Local - AWS official Docker image
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: nbhd-dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    volumes:
      - ./dynamodb_data:/data
    networks:
      - nbhd-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # DynamoDB Admin - Web UI for managing tables
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: nbhd-dynamodb-admin
    ports:
      - "8002:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
    depends_on:
      dynamodb-local:
        condition: service_healthy
    networks:
      - nbhd-network

  # Table Initializer - Runs once to create tables and run migrations
  table-init:
    build:
      context: .
      dockerfile: Dockerfile.init
    container_name: nbhd-table-init
    environment:
      - DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - DYNAMODB_TABLE_NAME=nbhd-city-development
    depends_on:
      dynamodb-local:
        condition: service_healthy
    networks:
      - nbhd-network
    volumes:
      - ./init:/app/init
      - ../scripts:/app/scripts
    command: bash -c "python /app/init/create_tables.py && python /app/scripts/add_nbhd_did_migration.py"

  # Backend API
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: nbhd-api
    ports:
      - "8001:8000"
    environment:
      - AWS_REGION=us-east-1
      - DYNAMODB_TABLE_NAME=nbhd-city-development
      - DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - SECRET_KEY=dev-secret-key-change-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - FRONTEND_URL=http://localhost:5173
      - BLUESKY_OAUTH_CLIENT_ID=http://localhost:8001/client-metadata.json
      - BLUESKY_OAUTH_CLIENT_SECRET=development-secret
      - BLUESKY_OAUTH_REDIRECT_URI=http://localhost:5173/callback.html
    depends_on:
      dynamodb-local:
        condition: service_healthy
      table-init:
        condition: service_completed_successfully
    networks:
      - nbhd-network
    volumes:
      - ../api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

networks:
  nbhd-network:
    driver: bridge

volumes:
  dynamodb_data:
